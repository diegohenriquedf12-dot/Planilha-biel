<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e14" />
  <title>NeoFinance — Controle Financeiro Pessoal</title>
  <meta name="description" content="Controle financeiro pessoal moderno: dashboard, cartões, metas, orçamento, relatórios e IA de economia." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B9%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== Splash ===== -->
  <div id="splash" class="splash">
    <div class="splash-logo">
      <span class="logo-mark">◈</span>
      <span class="logo-text">Neo<b>Finance</b></span>
    </div>
    <div class="splash-bar"><i></i></div>
  </div>

  <!-- ===== Auth ===== -->
  <div id="auth" class="auth hidden">
    <div class="auth-bg"></div>
    <div class="auth-card glass">
      <div class="auth-brand">
        <span class="logo-mark">◈</span>
        <h1>Neo<b>Finance</b></h1>
        <p class="muted">Seu dinheiro, sob controle total.</p>
      </div>

      <form id="loginForm" class="auth-form">
        <h2 id="authTitle">Entrar</h2>
        <label class="field" id="nameField" style="display:none">
          <span>Nome</span>
          <input type="text" id="authName" autocomplete="name" placeholder="Seu nome" />
        </label>
        <label class="field">
          <span>E-mail</span>
          <input type="email" id="authEmail" autocomplete="email" placeholder="voce@email.com" required />
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" id="authPass" autocomplete="current-password" placeholder="••••••••" required />
        </label>
        <div id="authError" class="auth-error"></div>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">Entrar</button>
        <p class="auth-switch">
          <span id="switchText">Não tem conta?</span>
          <a href="#" id="switchAuth">Criar agora</a>
        </p>
        <button type="button" class="btn btn-ghost btn-block" id="demoLogin">Entrar no modo demonstração</button>
      </form>
    </div>
  </div>

  <!-- ===== App ===== -->
  <div id="app" class="app hidden">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="logo-mark">◈</span>
        <span class="logo-text">Neo<b>Finance</b></span>
        <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Fechar menu">✕</button>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="user-chip" id="userChip">
          <span class="avatar" id="userAvatar">B</span>
          <div class="user-meta">
            <b id="userName">Usuário</b>
            <small id="userEmail" class="muted">—</small>
          </div>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- Main -->
    <div class="main">
      <header class="topbar glass">
        <button class="icon-btn" id="menuBtn" aria-label="Abrir menu">☰</button>
        <div class="search">
          <span class="search-ico">🔍</span>
          <input type="text" id="globalSearch" placeholder="Buscar lançamentos, categorias…" />
          <div class="search-results" id="searchResults"></div>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" id="notifBtn" aria-label="Notificações">
            🔔<span class="badge-dot" id="notifDot" hidden></span>
          </button>
          <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Alternar tema">
            <span class="sun">☀️</span><span class="moon">🌙</span>
          </button>
          <button class="btn btn-primary btn-sm" id="quickAdd">＋ Novo</button>
        </div>
        <div class="notif-panel glass" id="notifPanel" hidden></div>
      </header>

      <main class="content" id="view"></main>
    </div>
  </div>

  <!-- ===== Modal host ===== -->
  <div class="modal-host" id="modalHost" hidden>
    <div class="modal-scrim" id="modalScrim"></div>
    <div class="modal glass" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <!-- ===== Toasts ===== -->
  <div class="toast-wrap" id="toasts"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
